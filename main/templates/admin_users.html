{% extends 'base.html' %}
{% block content %}
<div class="card border-0 shadow-sm rounded-3 bg-white p-4" style="max-width: 600px; margin: 0 auto;">
    <h3 class="fw-bold mb-4 text-center">👥 База пользователей системы</h3>
    <div class="list-group shadow-2xs">
        {% for u in users_list %}
        <div class="list-group-item d-flex justify-content-between align-items-center p-3">
            <div>
                <span class="fs-5 text-dark fw-bold">{{ u.username }}</span>
                <div class="text-muted small">ID учетной записи: #{{ u.id }}</div>
            </div>
            {% if u.is_staff %}
            <span class="badge bg-danger px-3 py-2 rounded-pill fw-bold">Администратор</span>
            {% else %}
            <span class="badge bg-success px-3 py-2 rounded-pill fw-bold">Клиент</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
