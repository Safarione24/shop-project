{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card border-0 shadow rounded-3 bg-white">
            <div class="card-body p-4 p-sm-5">
                <h4 class="card-title text-center fw-bold mb-4">✍️ Ваш отзыв о товаре</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3 d-grid gap-2">
                        {{ form.as_p }}
                    </div>
                    <button type="submit"
                        class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold shadow-sm mt-3">Опубликовать на
                        витрине</button>
                </form>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 btn-sm mt-2 rounded-3">Отмена</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
