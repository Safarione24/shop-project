{% extends 'index.html' %}

{% block content %}
<div style="max-width: 400px;" class="mx-auto mt-5 p-4 border rounded bg-white shadow-sm">
    <h3 class="mb-3">Вход</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
    </form>
    <p class="mt-3 text-center"><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
</div>
{% endblock %}
